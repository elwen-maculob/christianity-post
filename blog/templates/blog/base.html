{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Christianity Post{% endblock %}</title>
   
    <link rel="stylesheet" href="{% static 'blog/css/custom.css' %}">
</head>
<body>

<header class="site-header">
    <nav class="navbar">
        <div class="logo">
            <a href="{% url 'blog:home' %}">Christianity Post</a>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'blog:home' %}">Home</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">Reflections</a></li>
            <li><a href="#">Quiz</a></li>
            <li><a href="#">Subscribe</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
</header>
<!-- Main Dynamic Content Block -->
 <main class="main-content">
    {% block content %}
    {% endblock %}
</main>

<!-- Footer Block -->
 <footer class="site-footer">
    <p>&copy; 2026 Christianity Post. All rights reserved.</p>
</footer>
</body>
</html>
