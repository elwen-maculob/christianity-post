{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Christianity Post{% endblock %}</title>
    <!--style.css file linker-->
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
<!-- Header / Navigation block-->
<header class=""site-header">
    <nav class="navbar">
        <div class="logo">
            <a href=""{% url 'blog:post_list' %}">Christianity Post</a>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <ul><a href="#">Blog</a></ul>
            <ul><a href="#">Reflections</a>a></ul>
            <ul><a href="#">Quiz</a></ul>
            <ul><a href="#">Subscribe</a></ul>
            <ul><a href="#">About</a></ul>
        </ul>
    </nav>
</header>
<!-- Main Dynamic Content Block -->
 <main class="main-content">
    {% block content %}
    {% endblock %}
</main>

<!-- Footer Block -->
 <footer class="site-footer">
    <p>&copy; 2026 Christianity Post. All rights reserved.</p>
</footer>
</body>
</html>
