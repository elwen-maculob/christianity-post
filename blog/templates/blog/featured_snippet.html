<div class="featured-section-container">
    <div class="featured-header">
        <h3>Featured Posts</h3>
        <p>Explore more of our latest writings and insights.</p>
    </div>

    <div class="blog-list" style="margin-top: 20px;">
        {% for post in featured_posts %}
            <div class="blog-card" style="background: #ffffff; color: #333; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;">
                <div class="card-content">
                    <p class="post-date" style="color: #666; font-size: 0.9rem;">{{ post.created_on|date:"F j, Y" }}</p>
                    <a href="{% url 'blog:post_detail' post.slug %}" style="text-decoration: none; color: #111;">
                        <h3 style="margin: 10px 0;">{{ post.title }}</h3>
                    </a>
                    <p class="post-description" style="color: #444;">{{ post.description }}</p>
                </div>
            </div>
        {% empty %}
            <p>No featured posts available.</p>
        {% endfor %}
    </div>
</div>
