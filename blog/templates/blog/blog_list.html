{% extends 'blog/base.html' %}
{% block title %}Blog list - Christianity Post{% endblock %}
{% block content %}
<div class="blog-list-container">
    <h2>Blog Posts</h2>

    <div class="blog-list">
        {% for post in blog_list %}
            <div class="blog-card" style="background: #ffffff; color: #333; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;">
                <div class="card-content">
                    <p class="post-date">{{ post.created_on|date:"F j, Y" }}</p>
                    <a href="{% url 'blog:post_detail' post.slug %}">
                        <h3>{{ post.title }}</h3>
                    </a>
                    <p class="post-description">{{ post.description }}</p>
                </div>
            </div>
        {% empty %}
            <p>No blog posts available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
